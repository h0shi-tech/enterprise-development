name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VetClinic.slnx

      - name: Build solution
        run: dotnet build VetClinic.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --solution VetClinic.slnx --configuration Release --no-build
